<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMOBI - Cadastrar Novo Imóvel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.cdnfonts.com/css/glacial-indifference');
    body { font-family: 'Glacial Indifference', sans-serif; background-color: #fafafa; }
    .bg-mobi-topbar { background-color: #1f123a; }
    .text-mobi-purple { color: #3b1b6c; }
    .nav-item { background-color: transparent; color: #374151; transition: background-color 0.2s ease, color 0.2s ease; }
    .nav-item:not(.active):hover { background-color: #f3ebff; color: #3b1b6c; }
    .nav-item.active { background-color: #e2d3ff !important; color: #3b1b6c !important; font-weight: 600; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">

  <!-- TOPBAR -->
  <header class="w-full bg-mobi-topbar text-white px-8 h-28 flex items-center justify-between border-b border-purple-900/40 z-20 shrink-0">
    <a href="corretor.html" class="h-full py-4 flex items-center">
      <img src="width_200.png" alt="IMOBI" class="h-full w-auto object-contain mix-blend-screen filter contrast-125" />
    </a>

    <div class="flex items-center gap-3.5 cursor-pointer">
      <div class="w-12 h-12 rounded-full bg-[#a382c9] flex items-center justify-center overflow-hidden">
        <i class="fa-solid fa-user text-[#1f123a] text-2xl mt-1"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-white font-semibold text-lg leading-snug">Eduardo</span>
        <span class="text-white text-xs opacity-90">Corretor</span>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden h-[calc(100vh-112px)]">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#fafafa] flex flex-col justify-between border-r border-gray-200 p-4 shrink-0 h-full text-gray-700 z-10">
      <nav class="space-y-1 flex-1">
        <a href="corretor.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <div class="w-6 h-6 flex items-center justify-center shrink-0 overflow-hidden">
            <img src="casa_pagina_principal-removebg-preview-Photoroom.png" alt="Página inicial" class="w-full h-full object-contain scale-150 mix-blend-multiply">
          </div>
          <span>Página inicial</span>
        </a>
        <a href="imoveis.html" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <div class="w-6 h-6 flex items-center justify-center shrink-0 overflow-hidden">
            <img src="casa_imoveis.png" alt="Imóveis" class="w-full h-full object-contain scale-150 mix-blend-multiply">
          </div>
          <span>Imóveis</span>
        </a>
        <a href="clientes.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <div class="w-6 h-6 flex items-center justify-center shrink-0">
            <img src="pessoas_cliente_cadastrado.png" alt="Clientes" class="w-5 h-5 object-contain mix-blend-multiply">
          </div>
          <span>Clientes</span>
        </a>
        <a href="agenda.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <i class="fa-solid fa-calendar-days w-6 text-center text-gray-700 shrink-0"></i>
          <span>Agenda</span>
        </a>
        <a href="mensagens.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <i class="fa-solid fa-comment-dots w-6 text-center text-gray-700 shrink-0"></i>
          <span>Mensagens</span>
        </a>
        <a href="propostas.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <div class="w-6 h-6 flex items-center justify-center shrink-0 overflow-hidden">
            <img src="papel_corretores.png" alt="Propostas" class="w-full h-full object-contain scale-150 mix-blend-multiply">
          </div>
          <span>Propostas</span>
        </a>
        <a href="configuracoes.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
          <i class="fa-solid fa-gear w-6 text-center text-gray-700 shrink-0"></i>
          <span>Configurações</span>
        </a>
      </nav>
      <div class="space-y-1 border-t border-gray-200 pt-4 mt-auto shrink-0 text-gray-700">
        <a href="ajuda.html" class="flex items-center gap-3 px-3 py-2 hover:bg-gray-100 rounded-lg hover:text-[#3b1b6c]">
          <i class="fa-regular fa-circle-question w-6 text-center"></i> Ajuda
        </a>
        <a href="#sair" class="flex items-center gap-3 px-3 py-2 hover:bg-gray-100 rounded-lg hover:text-[#3b1b6c]">
          <i class="fa-solid fa-arrow-right-from-bracket w-6 text-center"></i> Sair
        </a>
      </div>
    </aside>

    <!-- CONTEÚDO FORMULÁRIO -->
    <main class="flex-1 overflow-y-auto bg-[#fafafa] p-8">
      <div class="max-w-4xl mx-auto space-y-6">

        <div>
          <a href="imoveis.html" class="text-xs font-bold text-mobi-purple hover:underline inline-flex items-center gap-1.5 mb-2">
            <i class="fa-solid fa-arrow-left"></i> Voltar para imóveis
          </a>
          <h1 class="text-2xl font-extrabold text-mobi-purple">Cadastrar Novo Imóvel</h1>
          <p class="text-sm text-gray-500">Adicione as características, localização e valor do imóvel ao catálogo.</p>
        </div>

        <form onsubmit="salvarImovel(event)" class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm space-y-6">

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Título do Anúncio *</label>
              <input type="text" id="tituloImovel" required placeholder="Ex: Apartamento Moderno nos Jardins" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Finalidade</label>
              <select id="finalidadeImovel" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
                <option value="Venda">Venda</option>
                <option value="Locação">Locação</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Tipo de Imóvel</label>
              <select id="tipoImovel" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
                <option value="Apartamento">Apartamento</option>
                <option value="Casa">Casa</option>
                <option value="Cobertura">Cobertura</option>
                <option value="Comercial">Sala Comercial</option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Bairro e Cidade *</label>
              <input type="text" id="localImovel" required placeholder="Ex: Jardins, São Paulo - SP" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Valor (R$) *</label>
              <input type="text" id="precoImovel" required placeholder="R$ 950.000" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Quartos</label>
              <input type="number" id="quartosImovel" min="0" value="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Banheiros</label>
              <input type="number" id="banheirosImovel" min="0" value="2" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-800 mb-1.5">Área (m²)</label>
              <input type="number" id="areaImovel" min="10" value="110" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]">
            </div>
          </div>

          <!-- Foto do Imóvel -->
          <div>
            <label class="block text-sm font-bold text-gray-800 mb-1.5">Foto Principal do Imóvel</label>
            <div class="flex flex-col sm:flex-row items-center gap-4">
              <img id="previewFotoImovel" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500" alt="Preview" class="w-36 h-24 object-cover rounded-xl border border-gray-200 shrink-0">
              <label class="flex-1 w-full border-2 border-dashed border-purple-300 bg-purple-50/40 hover:bg-purple-50 rounded-2xl p-5 flex flex-col items-center justify-center cursor-pointer transition">
                <i class="fa-regular fa-image text-2xl text-mobi-purple mb-1"></i>
                <span class="text-sm font-semibold text-mobi-purple">Escolher imagem do computador</span>
                <span class="text-xs text-gray-400">JPG, PNG ou WEBP</span>
                <input type="file" accept="image/*" class="hidden" onchange="carregarPreviewImovel(this)">
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-800 mb-1.5">Descrição Detalhada</label>
            <textarea rows="3" placeholder="Diferenciais do imóvel, condomínio, lazer, vagas de garagem..." class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#3b1b6c]"></textarea>
          </div>

          <div class="flex items-center justify-end gap-4 pt-4 border-t border-gray-100">
            <a href="imoveis.html" class="px-6 py-2.5 border border-gray-300 rounded-xl text-sm font-bold text-gray-700 hover:bg-gray-50 transition">
              Cancelar
            </a>
            <button type="submit" class="px-6 py-2.5 bg-[#1f123a] hover:bg-[#3b1b6c] text-white rounded-xl text-sm font-bold transition shadow-sm">
              Salvar Imóvel
            </button>
          </div>

        </form>
      </div>
    </main>
  </div>

  <script>
    let imagemBase64 = 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500';

    function carregarPreviewImovel(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagemBase64 = e.target.result;
          document.getElementById('previewFotoImovel').src = imagemBase64;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function salvarImovel(e) {
      e.preventDefault();
      const novoImovel = {
        titulo: document.getElementById('tituloImovel').value.trim(),
        local: document.getElementById('localImovel').value.trim(),
        preco: document.getElementById('precoImovel').value.trim(),
        quartos: document.getElementById('quartosImovel').value,
        banheiros: document.getElementById('banheirosImovel').value,
        area: document.getElementById('areaImovel').value,
        foto: imagemBase64
      };

      const imoveis = JSON.parse(localStorage.getItem('imobi_imoveis') || '[]');
      imoveis.unshift(novoImovel);
      localStorage.setItem('imobi_imoveis', JSON.stringify(imoveis));

      alert('Imóvel cadastrado com sucesso!');
      window.location.href = 'imoveis.html';
    }
  </script>
</body>
</html>
